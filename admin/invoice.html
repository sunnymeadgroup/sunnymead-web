<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Invoice | Sunnymead Web</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root { --sun: #f28c00; --navy: #0f2a4a; --ink: #1f2933; --muted: #616e7c; --line: #e4e7eb; --cream: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--cream); line-height: 1.5; font-size: 15px; }
    .bar { max-width: 820px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--sun); background: var(--sun); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; font: inherit; font-weight: 600; }
    .btn.ghost { background: #fff; color: var(--navy); border-color: var(--line); }
    .sheet { max-width: 820px; margin: 16px auto 40px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 48px; }
    .top { display: flex; justify-content: space-between; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
    .top img { height: 34px; }
    h1 { color: var(--navy); font-size: 2rem; margin: 0 0 4px; letter-spacing: 1px; }
    .meta { text-align: right; color: var(--muted); }
    .meta b { color: var(--ink); }
    .cols { display: flex; justify-content: space-between; gap: 30px; margin: 36px 0 28px; flex-wrap: wrap; }
    .cols h3 { margin: 0 0 6px; font-size: .78rem; color: var(--muted); letter-spacing: 1px; font-weight: 600; }
    .cols p { margin: 0; white-space: pre-line; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .78rem; color: var(--muted); letter-spacing: 1px; font-weight: 600; padding: 10px 0; border-bottom: 2px solid var(--navy); }
    td { padding: 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align: right; white-space: nowrap; padding-left: 20px; }
    .total td { border-bottom: 0; font-size: 1.25rem; font-weight: 700; color: var(--navy); padding-top: 18px; }
    .pay { margin-top: 30px; background: var(--cream); border-radius: 10px; padding: 18px 20px; }
    .pay h3 { margin: 0 0 8px; color: var(--navy); font-size: 1rem; }
    .pay dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; margin: 0; }
    .pay dt { color: var(--muted); }
    .pay dd { margin: 0; font-weight: 600; }
    .note { margin-top: 20px; color: var(--muted); }
    .stamp { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; }
    .stamp.paid { background: #e6f4ec; color: #1f7a4d; }
    .stamp.owed { background: #fff3df; color: #9a5b00; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { border: 0; margin: 0; padding: 0; max-width: none; }
      .stamp.owed { display: none; }
    }
    @media (max-width: 600px) { .sheet { padding: 24px; } .meta { text-align: left; } }
  </style>
</head>
<body>
  <div class="bar">
    <a class="btn ghost" href="/admin/">Back to admin</a>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="undoBtn" style="display:none">Undo invoice</button>
      <button class="btn ghost" id="paidBtn" style="display:none">Mark as paid</button>
      <button class="btn" onclick="window.print()">Print or save as PDF</button>
    </span>
  </div>
  <div class="sheet" id="sheet"><p>Loading invoice</p></div>

  <script>
  (function () {
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var gbp = function (n) { return '£' + Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var fmt = function (d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; };
    var query = new URLSearchParams(location.search);
    var id = query.get('id'), venture = query.get('venture') || 'sunnymead-web';

    function render(D) {
      var inv = (D.invoices || []).find(function (i) { return i.id === id; });
      if (!inv) { document.getElementById('sheet').innerHTML = '<p>Invoice not found.</p>'; return; }
      var s = D.sites.find(function (x) { return x.id === inv.site; }) || {};
      var b = inv.issuer || { ...(D.business || {}), legalName: D.company && D.company.name, companyNumber: D.company && D.company.companyNumber, registeredAddress: D.company && D.company.registeredAddress };
      var led = D.ledger.find(function (l) { return l.id === inv.ledgerId; });
      var paid = led && led.paid;
      if (!led) { document.getElementById("sheet").textContent = "The invoice payment record is missing. Check the books before marking it paid."; return; }
      document.title = 'Invoice ' + inv.number + ' | ' + (b.name || 'Sunnymead Web');
      var bank = b.accountNumber ? '<div class="pay"><h3>How to pay</h3><dl>' +
        (b.bankName ? '<dt>Bank</dt><dd>' + esc(b.bankName) + '</dd>' : '') +
        (b.accountName ? '<dt>Account name</dt><dd>' + esc(b.accountName) + '</dd>' : '') +
        '<dt>Sort code</dt><dd>' + esc(b.sortCode) + '</dd><dt>Account number</dt><dd>' + esc(b.accountNumber) + '</dd>' +
        '<dt>Reference</dt><dd>' + esc(inv.number) + '</dd></dl></div>' : '<div class="pay"><h3>How to pay</h3><p style="margin:0">Add your bank details in Settings so they show here.</p></div>';
      document.getElementById('sheet').innerHTML =
        '<div class="top"><div><h2>' + esc(b.name || 'Sunnymead Web') + '</h2><small>' + esc(b.legalName || 'Sunnymead Group Ltd') + '</small></div>' +
        '<div class="meta"><h1>INVOICE</h1><div><b>' + esc(inv.number) + '</b></div><div>Date: ' + fmt(inv.date) + '</div><div>Due: <b>' + fmt(inv.due) + '</b></div>' +
        '<span class="stamp ' + (paid ? 'paid">Paid' : 'owed">Not paid yet') + '</span></div></div>' +
        '<div class="cols"><div><h3>FROM</h3><p><b>' + esc(b.name || 'Sunnymead Web') + '</b>\n' + esc(b.legalName || 'Sunnymead Group Ltd') + (b.companyNumber ? '\nCompany no: ' + esc(b.companyNumber) : '') + '\n' + esc(b.address || b.registeredAddress || '') + (b.email ? '\n' + esc(b.email) : '') + (b.phone ? '\n' + esc(b.phone) : '') + '</p></div>' +
        '<div><h3>TO</h3><p><b>' + esc(inv.customer || s.client || s.name) + '</b>' + (inv.customerAddress ? '\n' + esc(inv.customerAddress) : '') + ((inv.customerEmail || s.email) ? '\n' + esc(inv.customerEmail || s.email) : '') + (s.phone ? '\n' + esc(s.phone) : '') + '</p></div></div>' +
        '<table><thead><tr><th>Description</th><th class="num">Amount</th></tr></thead><tbody>' +
        inv.lines.map(function (l) { return '<tr><td>' + esc(l.desc) + '</td><td class="num">' + gbp(l.amount) + '</td></tr>'; }).join('') +
        ((inv.vat || 0) > 0 ? '<tr><td>VAT included in total (entered)</td><td class="num">' + gbp(inv.vat) + '</td></tr>' : '') + '<tr class="total"><td>Total due</td><td class="num">' + gbp(inv.total) + '</td></tr></tbody></table>' +
        (inv.note ? '<p class="note"><b>Payment terms:</b> ' + esc(inv.note) + '</p>' : '') +
        bank +
        '<p class="note">' + esc(b.footer || 'Thank you for your business.') + '</p>';
      var undo = document.getElementById('undoBtn');
      undo.style.display = paid || led.reconciled ? 'none' : '';
      undo.onclick = function () {
        if (!confirm('Undo invoice ' + inv.number + ' (' + gbp(inv.total) + ')? This removes the invoice and its linked unpaid income entry. Its removal stays in Record history.')) return;
        undo.disabled = true;
        fetch('/api/invoice-delete?venture=' + encodeURIComponent(venture), { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: inv.id }) })
          .then(function (r) { return r.json(); }).then(function (r) {
            if (r.error) { alert(r.error); return; }
            document.getElementById('sheet').textContent = 'Invoice undone. Its unpaid income entry has also been removed.';
            undo.style.display = 'none'; document.getElementById('paidBtn').style.display = 'none';
          }).catch(function () { alert('Could not undo the invoice. Refresh the page and try again.'); }).finally(function () { undo.disabled = false; });
      };
      var pb = document.getElementById('paidBtn');
      pb.style.display = paid ? 'none' : '';
      pb.onclick = function () {
        led.paid = true; led.paidDate = new Date().toISOString().slice(0, 10);
        pb.disabled = true;
        fetch('/api/save?venture=' + encodeURIComponent(venture), { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ collection: 'ledger', item: led }) }).then(function (r) { return r.json(); }).then(function (r) { if (r.error) alert(r.error); else load(); }).catch(function () { alert('Could not update payment. Refresh and try again.'); }).finally(function () { pb.disabled = false; });
      };
    }
    function load() {
      fetch('/api/data?venture=' + encodeURIComponent(venture), { credentials: 'same-origin' }).then(function (r) {
        if (r.status === 401) { location.href = '/admin/'; return null; }
        return r.json();
      }).then(function (D) { if (D) render(D); });
    }
    load();
  })();
  </script>
</body>
</html>
